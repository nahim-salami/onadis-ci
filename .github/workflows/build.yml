name: ONADIS build
run-name: "ONADIS ${{ inputs.ref }}"

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branche ou commit du dépôt privé
        required: true
        default: main
      plugins:
        description: Compiler aussi les plugins CAO (Windows)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  core:
    name: Moteur (tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: relay
      - uses: actions/checkout@v4
        with:
          repository: nahim-salami/ONADIS
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.ONADIS_DEPLOY_KEY }}
          persist-credentials: false
          path: app
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restauration, compilation et tests (sortie privée)
        id: test
        shell: bash
        run: |
          mkdir -p out
          set +e
          export ONADIS_ORACLE_DIR="$PWD/out/oracles"
          # Jeux de test publics du CNIG (StaR-DT, PCRS) : lecture de donnees reelles par les tests.
          mkdir -p cnig
          curl -sfL -o cnig/enedis.gml https://raw.githubusercontent.com/cnigfr/StaR-DT/master/JeuxTest/enedis.gml || true
          curl -sfL -o cnig/pcrs.gml https://raw.githubusercontent.com/cnigfr/PCRS/master/JeuxTest/JeuxTestv2.gml || true
          export ONADIS_CNIG_DIR="$PWD/cnig"
          # Nuages LAZ publics (jeux de test de laspy et de PDAL) : decompression comparee a laspy + lazrs par l oracle.
          mkdir -p laz
          for f in simple.laz 1_4_w_evlr.laz extra.laz plane.laz simple.copc.laz autzen_trim.laz; do
            curl -sfL -o "laz/$f" "https://raw.githubusercontent.com/laspy/laspy/master/tests/data/$f" || rm -f "laz/$f"
          done
          curl -sfL -o laz/simple.las.ref https://raw.githubusercontent.com/laspy/laspy/master/tests/data/simple.las || true
          for f in simple-laszip-compressor-version-1.2r0.laz las_with_several_extra_byte_bloc.laz; do
            curl -sfL -o "laz/$f" "https://raw.githubusercontent.com/PDAL/PDAL/master/test/data/laz/$f" || rm -f "laz/$f"
          done
          export ONADIS_LAZ_DIR="$PWD/laz"
          # Nuages E57 publics (donnees de test de libE57Format, CC0) : relus par pye57 dans l oracle.
          mkdir -p e57
          for f in reference/bunnyDouble.e57 reference/bunnyInt32.e57 self/ColouredCubeDouble.e57 self/ColouredCubeFloat.e57; do
            curl -sfL -o "e57/$(basename $f)" "https://raw.githubusercontent.com/asmaloney/libE57Format-test-data/main/$f" || rm -f "e57/$(basename $f)"
          done
          export ONADIS_E57_DIR="$PWD/e57"
          dotnet test app/tests/Onadis.Core.Tests/Onadis.Core.Tests.csproj -c Release --nologo \
            --logger "trx;LogFileName=tests.trx" --results-directory out > out/test.log 2>&1
          code=$?
          # Outils annexes (compilation seulement, s ils existent)
          for t in app/tools/*/*.csproj app/examples/*/*.csproj; do
            [ -f "$t" ] || continue
            dotnet build "$t" -c Release --nologo >> out/tools.log 2>&1 || code=1
          done
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Oracles externes (IFC, LandXML, EPANET, SWMM, DWG, LAZ, E57, TLS, appli terrain)
        id: oracle
        shell: bash
        run: |
          code=0
          if [ -d out/oracles ] && [ -f app/tools/oracles/validate.py ]; then
            pip install -q ifcopenshell lxml wntr "laspy[lazrs]" pye57 pillow ezdxf swmm-toolkit > out/oracles.log 2>&1
            # Lecteur DWG independant : LibreDWG 0.14 compile depuis la source officielle (pas de paquet Ubuntu)
            ( curl -sfL -o /tmp/ldwg.tar.xz https://github.com/LibreDWG/libredwg/releases/download/0.14/libredwg-0.14.tar.xz               && tar xf /tmp/ldwg.tar.xz -C /tmp && cd /tmp/libredwg-0.14               && ./configure -q --disable-bindings --disable-docs --disable-python               && make -s -j4 && sudo make -s install && sudo ldconfig ) > out/libredwg.log 2>&1 || echo "LibreDWG : compilation impossible" >> out/oracles.log
            python3 app/tools/oracles/validate.py out/oracles >> out/oracles.log 2>&1 || code=1
            # Appli terrain : tests JavaScript (node --test, sans dependance), dont la relecture du fichier ecrit par ONADIS
            if [ -d app/tests/field ]; then
              ONADIS_ORACLE_DIR="$PWD/out/oracles" node --test app/tests/field/geo.test.mjs >> out/oracles.log 2>&1 || code=1
            fi
            if [ $code = 0 ]; then s=OK; else s=ECHEC; fi
            echo "Oracles externes : $s" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Résumé public
        shell: bash
        run: bash relay/scripts/summary.sh out/tests.trx "${{ steps.test.outputs.code }}"
      - name: Chiffrement de la sortie
        if: always()
        shell: bash
        run: bash relay/scripts/seal.sh out relay/keys/log_pub.pem core
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-logs
          path: |
            core.enc
            core.key
          retention-days: 3
      - name: Verdict
        shell: bash
        run: test "${{ steps.test.outputs.code }}" = "0" && test "${{ steps.oracle.outputs.code }}" = "0"

  plugins:
    name: Plugins CAO (AutoCAD / GstarCAD / ZWCAD) et ONADIS autonome
    if: ${{ inputs.plugins }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: relay
      - uses: actions/checkout@v4
        with:
          repository: nahim-salami/ONADIS
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.ONADIS_DEPLOY_KEY }}
          persist-credentials: false
          path: app
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Compilation (sortie privée)
        id: build
        shell: bash
        run: |
          mkdir -p out
          set +e
          rc=0
          for p in AutoCAD GstarCAD ZWCAD; do
            dotnet build "app/src/Onadis.$p/Onadis.$p.csproj" -c Release --nologo > "out/build-$p.log" 2>&1
            c=$?
            if [ $c = 0 ]; then s=OK; else s=ECHEC; rc=1; fi
            echo "Plugin $p : $s" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          # Scripts d'exemple de l'API publique (DLL netstandard2.0 chargee par ONADIS_SCRIPT).
          if [ -f app/examples/Onadis.ExampleScripts/Onadis.ExampleScripts.csproj ]; then
            dotnet build app/examples/Onadis.ExampleScripts/Onadis.ExampleScripts.csproj -c Release --nologo > out/build-scripts.log 2>&1 || rc=1
            mkdir -p out/package/Scripts
            cp app/examples/Onadis.ExampleScripts/bin/Release/netstandard2.0/Onadis.ExampleScripts.dll out/package/Scripts/ 2>/dev/null || true
          fi
          # ONADIS autonome (application WPF, runtime .NET 8 Desktop requis), s'il existe sur la branche.
          if [ -f app/src/Onadis.Desktop/Onadis.Desktop.csproj ]; then
            dotnet build app/src/Onadis.Desktop/Onadis.Desktop.csproj -c Release --nologo > out/build-Desktop.log 2>&1
            c=$?
            if [ $c = 0 ]; then s=OK; else s=ECHEC; rc=1; fi
            echo "ONADIS autonome : $s" | tee -a "$GITHUB_STEP_SUMMARY"
            mkdir -p out/package/Desktop && cp -r app/src/Onadis.Desktop/bin/Release/net8.0-windows/. out/package/Desktop/ 2>/dev/null || true
            # Planche d'apercu des icones ONADIS (option --icones d'ONADIS autonome), si elle existe sur la branche.
            if [ $c = 0 ] && [ -f app/src/Onadis.Desktop/IconSheet.cs ]; then
              pwsh -NoProfile -Command "Start-Process -Wait -FilePath '$(cygpath -w "$PWD/app/src/Onadis.Desktop/bin/Release/net8.0-windows/Onadis.Desktop.exe")' -ArgumentList '--icones','$(cygpath -w "$PWD/out/package/icones.png")'" > out/icons.log 2>&1 || true
            fi
            # Distribution (archive portable + installeur Inno Setup), si le script existe sur la branche.
            if [ $c = 0 ] && [ -f app/tools/desktop/package-desktop.ps1 ]; then
              if pwsh -NoProfile -File app/tools/desktop/package-desktop.ps1 -Source app/src/Onadis.Desktop/bin/Release/net8.0-windows -Repo app -Output out/package/Distribution > out/package-Desktop.log 2>&1; then s=OK; else s=ECHEC; rc=1; fi
              echo "Distribution ONADIS autonome : $s" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          fi
          # Paquet installable (chiffre avec les journaux) : DLL compilees par hote.
          for p in GstarCAD ZWCAD AutoCAD; do
            for d in app/src/Onadis.$p/bin/Release/*/; do
              [ -d "$d" ] || continue
              t="out/package/$p/$(basename "$d")"
              mkdir -p "$t" && cp -r "$d". "$t"/
            done
          done
          echo "code=$rc" >> "$GITHUB_OUTPUT"
      - name: Chiffrement de la sortie
        if: always()
        shell: bash
        run: bash relay/scripts/seal.sh out relay/keys/log_pub.pem plugins
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugins-logs
          path: |
            plugins.enc
            plugins.key
          retention-days: 3
      - name: Verdict
        shell: bash
        run: test "${{ steps.build.outputs.code }}" = "0"
